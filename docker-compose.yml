services:

    nginx:
        build: ./docker/nginx
        container_name: nginx
        restart: always
        command: [ "sh", "-c", "./docker/nginx/init.sh; nginx -g 'daemon off;'" ]
        volumes:
            - ./src:/var/src
            - ./docker/nginx/dev.conf:/etc/nginx/conf.d/default.conf
            - ./docker/nginx/fastcgi.conf:/etc/nginx/fastcgi.conf
            - ./docker/nginx/fastcgi-php.conf:/etc/nginx/snippets/fastcgi-php.conf
            - ./docker/nginx/ssl:/etc/ssl/certs
        depends_on:
            - mysql
            - postgres
            - php74
            - php82
            - php85
        ports:
            - 80:80
            - 443:443

    php74:
        build: ./docker/php-7.4
        container_name: php74
        command: [ "sh", "-c", "./docker/php/init.sh; php-fpm" ]
        volumes:
            - ./src:/var/src
            - ./docker/etc/php/php.ini:/usr/local/etc/php/php.ini
        ports:
            - 9007:9000
            - 8001:8000
        extra_hosts:
            - "host.docker.internal:host-gateway"
        environment:
            PHP_IDE_CONFIG: "serverName=docker-debug"
            XDEBUG_MODE: "debug"
            XDEBUG_CONFIG: "client_host=host.docker.internal client_port=9099"

    php82:
        build: ./docker/php-8.2
        container_name: php82
        command: [ "sh", "-c", "./docker/php/init.sh; php-fpm" ]
        volumes:
            - ./src:/var/src
            - ./docker/etc/php/php.ini:/usr/local/etc/php/php.ini
        ports:
            - 9008:9000
            - 8002:8000
        extra_hosts:
            - "host.docker.internal:host-gateway"
        environment:
            PHP_IDE_CONFIG: "serverName=docker-debug"
            XDEBUG_MODE: "debug"
            XDEBUG_CONFIG: "client_host=host.docker.internal client_port=9099"

    php85:
        build: ./docker/php-8.5
        container_name: php85
        command: [ "sh", "-c", "./docker/php/init.sh; php-fpm" ]
        volumes:
            - ./src:/var/src
            - ./docker/etc/php/php.ini:/usr/local/etc/php/php.ini
        ports:
            - 9009:9000
            - 8000:8000
        extra_hosts:
            - "host.docker.internal:host-gateway"
        environment:
            PHP_IDE_CONFIG: "serverName=docker-debug"
            XDEBUG_MODE: "debug"
            XDEBUG_CONFIG: "client_host=host.docker.internal client_port=9099"

    mysql:
        image: mysql:8
        container_name: mysql
        restart: always
        environment:
            MYSQL_USER: root
            MYSQL_PASSWORD: root
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: mysql
        volumes:
            - ./docker/mysql:/var/lib/mysql
            - ./docker/etc/mysql:/etc/mysql/conf.d
        ports:
            - 3306:3306

    postgres:
        image: postgres:17
        container_name: postgres
        restart: always
        environment:
            POSTGRES_PASSWORD: root
            POSTGRES_USER: root
            POSTGRES_DB: postgres
        ports:
            - 5432:5432
        volumes:
            - ./docker/postgres:/var/lib/postgresql

    redis:
        image: redis:alpine
        container_name: redis
        restart: always
        ports:
            - 6380:6379

    adminer:
        image: adminer
        container_name: adminer
        restart: always
        depends_on:
            - postgres
            - mysql
        ports:
            - 8080:8080
        environment:
            ADMINER_DEFAULT_SERVER: mysql

    redis-master:
        image: redis:8-alpine
        container_name: redis-master
        restart: always
        command: redis-server --appendonly yes
        ports:
            - 6379:6379

    redis-slave:
        image: redis:8-alpine
        container_name: redis-slave
        restart: always
        command: redis-server --slaveof redis-master 6379 --appendonly yes
        depends_on:
            - redis-master

    redis-sentinel:
        image: redis:8-alpine
        container_name: redis-sentinel
        restart: always
        command: redis-sentinel /etc/redis/sentinel.conf
        volumes:
            - ./docker/redis/sentinel.conf:/etc/redis/sentinel.conf
        depends_on:
            - redis-master
            - redis-slave
        ports:
            - 26379:26379
